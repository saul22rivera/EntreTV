org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configureondemand=true
kotlin.incremental=true
android.useAndroidX=true
android.nonTransitiveRClass=true
# Las pruebas en el dispositivo (:baselineprofile) se instalan encima de la app de pruebas:
# sin esto, al terminar la desinstalan y se pierde la sesión iniciada.
android.injected.androidTest.leaveApksInstalledAfterRun=true
# Manifiesto de actualizaciones. Formato:
# https://github.com/<usuario>/<repo>/releases/latest/download/update.json
# Vacío = la app no busca actualizaciones.
entretv.updateUrl=https://github.com/saul22rivera/EntreTV/releases/latest/download/update.json
# Novedades que muestra el aviso de actualización (se copian a update.json).
# Gradle lee este archivo en ISO-8859-1: los acentos van como \u00XX.
entretv.releaseNotes=Reproductor en TV con opciones r\u00e1pidas (Audio, Subt\u00edtulos, Video, Formato, Velocidad, Mi lista), elegir pista de video, Sin video y Sin audio, y arreglo autom\u00e1tico cuando hay sonido sin imagen. Men\u00fa de opciones m\u00e1s ligero y cambio de formato al instante. El cat\u00e1logo se actualiza sin trabar la navegaci\u00f3n y avisa "Lista actualizada"; nuevas opciones: una vez al d\u00eda, tres veces al d\u00eda, autom\u00e1tica cada 3 horas o solo manual. Mant\u00e9n presionado un t\u00edtulo para agregarlo a favoritos (con coraz\u00f3n en el p\u00f3ster). Men\u00fa de TV m\u00e1s directo y navegaci\u00f3n m\u00e1s fluida. Ordenar en la cabecera tambi\u00e9n en celular. El primer perfil toma el nombre que pusiste al entrar y se recuerda el \u00faltimo perfil. En la ficha ya no se atora el foco en la flecha de Atr\u00e1s.
# Las instalaciones con un versionCode menor quedan obligadas a actualizar (pantalla bloqueante).
entretv.minVersionCode=8
# Servidor Xtream de las cuentas: nunca se muestra en la app. Si cambia, basta con publicar
# un update.json nuevo: las apps instaladas lo toman al abrirse, sin reinstalar.
entretv.serverUrl=http://livedttv.com:8080/
# Clave de la API de TMDB (opcional). Mejor como tmdbApiKey=... en keystore.properties, que no se sube al repo.
# Sin clave, el Top 10 y las fichas usan los datos que manda el servidor Xtream.
entretv.tmdbApiKey=